<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeux — Monde des Gamers</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head><body data-bs-theme="dark">
<div class="page-head"><div class="container"><h1>Catalogue des jeux</h1><p class="text-mut">Filtre par genre, plateforme ou recherche directe.</p></div></div>
<section><div class="container">
 <div class="row g-3 mb-4 align-items-end">
  <div class="col-md-4"><label class="form-label" for="q">Recherche</label><input id="q" class="form-control" placeholder="Nom du jeu…"></div>
  <div class="col-6 col-md-3"><label class="form-label" for="fg">Genre</label><select id="fg" class="form-select"><option value="">Tous</option><option>FPS</option><option>RPG</option><option>Action</option><option>Course</option><option>MOBA</option></select></div>
  <div class="col-6 col-md-3"><label class="form-label" for="fp">Plateforme</label><select id="fp" class="form-select"><option value="">Toutes</option><option>PC</option><option>PS5</option><option>Xbox</option><option>Switch</option></select></div>
  <div class="col-md-2"><button id="reset" class="btn btn-line w-100">Réinitialiser</button></div>
 </div>
 <p id="count" class="text-mut" aria-live="polite"></p>
 <div class="row g-4" id="grid"></div>
</div></section>
<div class="modal fade" id="gameModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
 <img id="mImg" alt="" style="height:200px;object-fit:cover">
 <div class="modal-body p-4"><h2 class="h4" id="mTitle"></h2><p id="mBody" class="text-mut"></p>
 <a href="communauter.html" class="btn btn-neon">Trouver un tournoi</a> <button class="btn btn-line" data-bs-dismiss="modal">Fermer</button></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script></body></html>
